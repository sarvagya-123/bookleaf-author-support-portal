services:
  - type: web
    name: bookleaf-author-support-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGINS
        value: https://bookleaf-author-support-portal-one.vercel.app,https://bookleaf-author-support-portal-as5jii013.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_SIGNUP_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
